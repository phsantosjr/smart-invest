# Infraestrutura local do Smart Invest (dev).
# Uso (a partir de backend/): cp .env.example .env && docker compose up -d
# Ferramentas opcionais: docker compose --profile tools up -d

name: smart-invest

services:
  db:
    image: postgres:18-alpine
    container_name: smart-invest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_invest}
      POSTGRES_USER: ${POSTGRES_USER:-smart_invest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_invest}
    ports:
      # host:container — Postgres dentro do container sempre na 5432
      - "${POSTGRES_PORT:-25030}:5432"
    volumes:
      # Postgres 18+ (imagem oficial): dados em /var/lib/postgresql, não em .../data
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smart_invest} -d ${POSTGRES_DB:-smart_invest}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: smart-invest-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  adminer:
    profiles: [tools]
    image: adminer:4
    container_name: smart-invest-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - backend

  redisinsight:
    profiles: [tools]
    image: redis/redisinsight:latest
    container_name: smart-invest-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - backend

networks:
  backend:
    name: smart-invest-backend

volumes:
  postgres_data:
    name: smart-invest-postgres-data
  redisinsight_data:
    name: smart-invest-redisinsight-data